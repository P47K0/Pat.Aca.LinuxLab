name = "cka-lab-ui-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Custom domain — requires koorevaar.com already added as a Cloudflare zone,
# and a Cloudflare Access application covering this hostname (see the repo
# README's "Manual setup" section; not something wrangler configures).
routes = [
  { pattern = "lab.koorevaar.com", custom_domain = true }
]

[vars]
# The API's SignalR hub endpoint. Same Cloudflare Access application should
# also cover this hostname — see the README.
LAB_HUB_URL = "https://api.lab.koorevaar.com/hubs/lab"

# The feedback form (/feedback route in src/index.ts) calls the
# koorevaar.com contact Worker's handleContactForm directly, in-process —
# no public URL, no CORS, no auth to configure. Also reachable publicly at
# contact.koorevaar.com, but the service binding below goes by Worker name
# ("contact"), not that URL.
[[services]]
binding = "CONTACT_WORKER"
service = "contact"

# Real Worker-version ID, changes on every deploy (even a redeploy of
# identical code) — available at runtime with no build command needed,
# unlike Workers Builds' own WORKERS_CI_* variables (build-time only,
# confirmed via Cloudflare's docs). Used with the KV namespace below to
# compute a simple build counter ourselves, entirely at runtime — no
# API token, no custom build step, no external CI plumbing.
[version_metadata]
binding = "CF_VERSION_METADATA"

# One-time manual step required — see the README's "Manual setup":
# create the namespace (Cloudflare dashboard or `wrangler kv namespace
# create BUILD_INFO`) and replace the placeholder id below with the real
# one. Until then this binding just won't resolve and the footer's
# build-counter code below falls back to hiding it, not erroring.
[[kv_namespaces]]
binding = "VERSION_KV"
id = "92ff1099563c4d25ae87e7a8747a9d74"

[observability]
enabled = true
