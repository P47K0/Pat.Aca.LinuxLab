name = "cka-lab-ui-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Custom domain — requires koorevaar.com already added as a Cloudflare zone,
# and a Cloudflare Access application covering this hostname (see the repo
# README's "Manual setup" section; not something wrangler configures).
routes = [
  { pattern = "lab.koorevaar.com", custom_domain = true }
]

[vars]
# The API's SignalR hub endpoint. Same Cloudflare Access application should
# also cover this hostname — see the README.
LAB_HUB_URL = "https://api.lab.koorevaar.com/hubs/lab"

# The feedback form (/feedback route in src/index.ts) calls the
# koorevaar.com Worker's contact-form handler directly, in-process — no
# public URL, no CORS, no auth to configure. "service" must be that
# Worker's actual deployed name (wrangler.toml's own `name` field over
# there) — REPLACE_WITH_REAL_WORKER_NAME is a placeholder, not a guess to
# trust.
[[services]]
binding = "CONTACT_WORKER"
service = "REPLACE_WITH_REAL_WORKER_NAME"

[observability]
enabled = true
