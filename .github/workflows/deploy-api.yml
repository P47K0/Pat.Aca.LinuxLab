name: Build & deploy API

# Manual-trigger only, matching Pat.Aca.BlogServiceApi's convention.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Pat.Aca.LinuxLab.Api
          push: true
          # :latest is tagged too, for convenience browsing Docker Hub, but
          # the deploy step below uses the SHA tag specifically — a
          # floating tag makes it genuinely ambiguous whether a redeploy
          # actually rolled out new content or reused something cached,
          # which is exactly the "still shows the old version" symptom a
          # mutable tag invites.
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/cka-lab-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/cka-lab-api:${{ github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # update-or-create: `az containerapp update` fails outright if the app
      # doesn't exist yet, which is true on the very first run — so try
      # update first and fall back to create. LabSession__SelfUrl is left
      # unset on the very first create (chicken-and-egg: the URL isn't known
      # until after this creates it) — set it as a var once you have it and
      # re-run, same pattern as this project's COSMOS_ENDPOINT_URI.
      #
      # Both branches pass the SAME full env-vars list, on purpose: `az
      # containerapp update --set-env-vars` REPLACES the entire list rather
      # than merging (same gotcha already hit once in this project's sibling
      # blog-service-api) — passing only what changed would silently wipe
      # every other setting on the running app.
      - name: Update or create Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e
            NAME=cka-lab-api
            RG=${{ vars.AZURE_RESOURCE_GROUP }}
            IMAGE=${{ vars.DOCKERHUB_USERNAME }}/cka-lab-api:${{ github.sha }}
            # MaxSessionStartsPerHour is the only optional var here (`||`
            # falls back to 15 if LAB_MAX_SESSION_STARTS_PER_HOUR isn't set) -
            # everything else is required with no sensible default. Changing
            # just the var still needs a re-run of this workflow to actually
            # reach the running app, same as any other var here.
            ENV_VARS="LabSession__SubscriptionId=${{ secrets.AZURE_SUBSCRIPTION_ID }} \
              LabSession__ResourceGroup=$RG \
              LabSession__ContainerAppsEnvironmentName=${{ vars.ACA_ENVIRONMENT_NAME }} \
              LabSession__LabImage=${{ vars.DOCKERHUB_USERNAME }}/cka-lab:latest \
              LabSession__SelfUrl=${{ vars.API_SELF_URL }} \
              LabSession__AllowedOrigin=${{ vars.LAB_FRONTEND_ORIGIN }} \
              LabSession__MaxSessionStartsPerHour=${{ vars.LAB_MAX_SESSION_STARTS_PER_HOUR || '15' }} \
              CloudflareAccess__TeamDomain=${{ vars.CF_ACCESS_TEAM_DOMAIN }} \
              CloudflareAccess__Audience=${{ vars.CF_ACCESS_AUDIENCE }}"

            if az containerapp show --name "$NAME" --resource-group "$RG" >/dev/null 2>&1; then
              az containerapp update \
                --name "$NAME" \
                --resource-group "$RG" \
                --image "$IMAGE" \
                --set-env-vars $ENV_VARS
            else
              az containerapp create \
                --name "$NAME" \
                --resource-group "$RG" \
                --environment ${{ vars.ACA_ENVIRONMENT_NAME }} \
                --image "$IMAGE" \
                --system-assigned \
                --ingress external \
                --target-port 8080 \
                --env-vars $ENV_VARS

              echo "::notice::First create done. Copy this app's principal ID and FQDN, grant it Container Apps rights on $RG, set API_SELF_URL, then re-run."
              az containerapp show --name "$NAME" --resource-group "$RG" \
                --query "{principalId: identity.principalId, fqdn: properties.configuration.ingress.fqdn}"
            fi
